[project]
name = "nl2s-bench"
version = "0.1.0"
description = "NL to SPARQL benchmarking toolkit"
requires-python = ">=3.10"

dependencies = [
    "rdflib>=7.0.0",
]

[project.scripts]
classify-questions = "nl2s_bench.classify_questions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
