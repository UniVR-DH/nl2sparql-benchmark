[project]
name = "nl2s-bench"
version = "0.1.0"
description = "NL to SPARQL benchmarking toolkit"
requires-python = ">=3.10"
dependencies = [
    "pyproject-toml>=0.1.0",
    "rdflib>=7.0.0",
]

[project.scripts]
classify-questions = "scripts.classify_questions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
